[project]
name = "eveready-demand-planning-api"
version = "0.1.0"
description = "Data ingestion API for the Eveready demand planning demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "python-calamine>=0.2.3",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
]

[tool.uv]
package = false
